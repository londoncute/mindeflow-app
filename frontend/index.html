<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @keyframes fill-progress {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        .timed-fill {
            position: relative;
            overflow: hidden;
            isolation: isolate;
        }

        .timed-fill::before {
            content: "";
            position: absolute;
            inset: 0;
            transform: scaleX(0);
            transform-origin: left center;
            animation: fill-progress 2s linear forwards;
            z-index: -1;
        }

        .timed-fill-rose::before {
            background: rgba(244, 63, 94, 0.16);
        }

        .timed-fill-emerald::before {
            background: rgba(16, 185, 129, 0.18);
        }

        .progress-bar-running {
            animation: fill-progress 2s linear forwards;
            transform-origin: left center;
        }

        .progress-bar-running-slow {
            animation: fill-progress 5s linear forwards;
            transform-origin: left center;
        }

        .performer-follow {
            transition: transform 160ms ease-out;
            will-change: transform;
        }
    </style>
</head>
<body class="bg-[#f4f5f8] text-slate-800">
    <div id="auth-overlay" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm"></div>
        <div class="relative z-10 flex min-h-full items-center justify-center p-6">
            <div class="w-full max-w-md rounded-[28px] bg-white p-8 shadow-2xl shadow-slate-950/15">
                <div class="flex items-center gap-3">
                    <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 text-white shadow-lg shadow-indigo-500/25">
                        <i class="fa-solid fa-brain text-lg"></i>
                    </div>
                    <div>
                        <div class="text-lg font-bold text-slate-900">MindFlow</div>
                        <div class="text-sm text-slate-500">Вход в рабочий контур</div>
                    </div>
                </div>

                <div class="mt-6 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">
                    <span id="auth-helper-text">Тестовый вход: <span class="font-semibold text-slate-900">user@example.com</span> / <span class="font-semibold text-slate-900">mindflow123</span></span>
                </div>

                <div class="mt-6 grid grid-cols-2 gap-2 rounded-2xl bg-slate-100 p-1">
                    <button
                        id="auth-mode-login-button"
                        type="button"
                        class="rounded-2xl bg-white px-4 py-2.5 text-sm font-semibold text-slate-900 shadow-sm transition"
                    >
                        Войти
                    </button>
                    <button
                        id="auth-mode-register-button"
                        type="button"
                        class="rounded-2xl px-4 py-2.5 text-sm font-semibold text-slate-500 transition"
                    >
                        Регистрация
                    </button>
                </div>

                <form id="auth-form" class="mt-6 space-y-4">
                    <label id="auth-full-name-group" class="hidden block">
                        <span class="mb-2 block text-sm font-medium text-slate-700">Имя</span>
                        <input
                            name="full_name"
                            type="text"
                            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
                        >
                    </label>

                    <label class="block">
                        <span class="mb-2 block text-sm font-medium text-slate-700">Email</span>
                        <input
                            name="email"
                            type="email"
                            value="user@example.com"
                            required
                            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
                        >
                    </label>

                    <label class="block">
                        <span class="mb-2 block text-sm font-medium text-slate-700">Пароль</span>
                        <input
                            name="password"
                            type="password"
                            value="mindflow123"
                            required
                            class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
                        >
                    </label>

                    <div id="auth-error" class="hidden rounded-2xl border border-rose-100 bg-rose-50 px-4 py-3 text-sm text-rose-600"></div>

                    <button
                        id="auth-submit-button"
                        type="submit"
                        class="flex w-full items-center justify-center gap-2 rounded-2xl bg-indigo-600 px-5 py-3 text-sm font-semibold text-white shadow-sm shadow-indigo-600/20 transition hover:bg-indigo-700 active:bg-indigo-800"
                    >
                        <i class="fa-solid fa-right-to-bracket text-xs"></i>
                        Войти
                    </button>
                </form>

                <button
                    id="auth-mode-switch-button"
                    type="button"
                    class="mt-4 w-full text-sm font-medium text-slate-500 transition hover:text-slate-800"
                >
                    Нет аккаунта? Зарегистрироваться
                </button>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-slate-950/35 backdrop-blur-sm"></div>
        <div class="relative z-10 flex min-h-full items-center justify-center p-6">
            <div class="w-full max-w-2xl rounded-[28px] bg-white p-7 shadow-2xl shadow-slate-950/10">
                <div class="flex items-start justify-between gap-4">
                    <div>
                        <h2 id="modal-title" class="text-xl font-bold text-slate-900"></h2>
                        <p id="modal-description" class="mt-1 text-sm text-slate-500"></p>
                    </div>
                    <button
                        id="modal-close-button"
                        type="button"
                        class="flex h-10 w-10 items-center justify-center rounded-2xl bg-slate-100 text-slate-500 transition hover:bg-slate-200 hover:text-slate-700"
                    >
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form id="modal-form" class="mt-6 space-y-4">
                    <div id="modal-fields" class="space-y-4"></div>
                    <div class="flex items-center justify-end gap-3 pt-2">
                        <button
                            id="modal-secondary-button"
                            type="button"
                            class="hidden rounded-2xl border border-indigo-200 bg-indigo-50 px-4 py-2.5 text-sm font-medium text-indigo-600 transition hover:bg-indigo-100"
                        >
                            Дополнительно
                        </button>
                        <button
                            id="modal-cancel-button"
                            type="button"
                            class="rounded-2xl border border-slate-200 px-4 py-2.5 text-sm font-medium text-slate-600 transition hover:border-slate-300 hover:text-slate-800"
                        >
                            Отмена
                        </button>
                        <button
                            id="modal-submit-button"
                            type="submit"
                            class="rounded-2xl bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm shadow-indigo-600/20 transition hover:bg-indigo-700"
                        >
                            Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="switch-guard-overlay" class="fixed inset-0 z-40 hidden">
        <div class="absolute inset-0 bg-slate-950/35 backdrop-blur-sm"></div>
        <div class="relative z-10 flex min-h-full items-center justify-center p-6">
            <div class="w-full max-w-md rounded-[28px] bg-white p-7 shadow-2xl shadow-slate-950/10">
                <div id="switch-guard-title" class="text-xl font-bold text-slate-900">Вы еще не доделали задачи</div>
                <div id="switch-guard-description" class="mt-2 text-sm text-slate-500"></div>

                <div class="mt-6 flex flex-col gap-3">
                    <button
                        id="switch-guard-hold-button"
                        type="button"
                        class="relative overflow-hidden rounded-2xl border border-rose-200 bg-white px-5 py-3 text-sm font-semibold text-rose-600 transition"
                    >
                        <span
                            id="switch-guard-hold-fill"
                            class="origin-left scale-x-0 absolute inset-0 rounded-2xl bg-rose-500/20"
                        ></span>
                        <span class="relative">Переключиться</span>
                    </button>
                    <button
                        id="switch-guard-continue-button"
                        type="button"
                        class="rounded-2xl border border-slate-200 px-5 py-3 text-sm font-medium text-slate-600 transition hover:border-slate-300 hover:text-slate-900"
                    >
                        Продолжить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content" class="flex h-screen w-full overflow-hidden bg-[#f4f5f8] font-sans text-slate-800">
        <aside id="sidebar-navigation" class="z-20 flex h-full w-[280px] shrink-0 flex-col bg-[#111424] text-slate-300">
            <div class="p-6 pb-4">
                <div class="flex items-center gap-3">
                    <div class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-indigo-400 to-cyan-400 shadow-lg shadow-indigo-500/20">
                        <div class="h-4 w-4 rounded-full bg-white/30 backdrop-blur-sm"></div>
                    </div>
                    <div>
                        <div class="text-lg font-bold leading-tight tracking-tight text-white">MindFlow</div>
                    </div>
                </div>
            </div>

            <div class="px-4 pb-4">
                <div class="rounded-[22px] border border-white/5 bg-white/5 p-4">
                    <div class="flex items-center justify-between gap-3">
                        <div>
                            <div id="mode-name" class="text-sm font-semibold text-white">Умный тип</div>
                        </div>
                        <button
                            id="mode-toggle"
                            type="button"
                            class="relative inline-flex h-9 w-16 items-center rounded-full bg-slate-700 transition-colors"
                            aria-label="Переключить режим"
                        >
                            <span
                                id="mode-toggle-thumb"
                                class="inline-block h-7 w-7 translate-x-1 rounded-full bg-white shadow-md transition-transform"
                            ></span>
                        </button>
                    </div>
                </div>
            </div>

            <nav id="sidebar-tabs" class="flex-1 space-y-1.5 px-4">
                <button
                    id="sidebar-tab-inbox"
                    data-section="inbox"
                    type="button"
                    class="flex w-full items-center gap-3 rounded-xl bg-indigo-600 px-4 py-3 text-white shadow-md shadow-indigo-600/20 transition-all"
                >
                    <div class="flex items-center gap-3 text-sm font-medium">
                        <i class="fa-solid fa-inbox w-5 text-center"></i>
                        Inbox
                    </div>
                    <span id="inbox-sidebar-badge" class="ml-auto rounded-full bg-white/20 px-2 py-0.5 text-xs font-bold text-white">0</span>
                </button>

                <button
                    id="sidebar-tab-tasks"
                    data-section="tasks"
                    type="button"
                    class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-400 transition-colors hover:bg-white/5 hover:text-slate-200"
                >
                    <i class="fa-regular fa-square-check w-5 text-center"></i>
                    Tasks
                </button>

                <button
                    id="sidebar-tab-projects"
                    data-section="projects"
                    type="button"
                    class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-slate-400 transition-colors hover:bg-white/5 hover:text-slate-200"
                >
                    <i class="fa-solid fa-layer-group w-5 text-center"></i>
                    Projects
                </button>
            </nav>

            <div id="sidebar-performer-zone" class="hidden px-4 pb-4">
                <div class="relative h-[220px] overflow-hidden">
                    <video
                        id="sidebar-performer-video"
                        class="hidden"
                        loop
                        muted
                        playsinline
                        preload="auto"
                    >
                        <source src="/assets/performer.mp4" type="video/mp4">
                    </video>
                    <canvas
                        id="sidebar-performer"
                        width="240"
                        height="220"
                        class="performer-follow absolute bottom-0 left-1/2 h-[220px] w-auto -translate-x-1/2"
                    ></canvas>
                </div>
            </div>

            <div class="p-4 pb-5">
                <div class="rounded-2xl border border-white/5 bg-white/5 px-4 py-4">
                    <div id="sidebar-user-email" class="truncate text-sm font-medium text-white">-</div>
                    <button
                        id="sidebar-account-button"
                        class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl border border-white/10 bg-white/5 px-4 py-2.5 text-sm font-medium text-slate-200 transition hover:bg-white/10"
                    >
                        <i class="fa-solid fa-arrow-right-from-bracket text-xs"></i>
                        Выйти
                    </button>
                </div>
            </div>
        </aside>

        <main class="relative flex h-full flex-1 flex-col">
            <header id="header-top" class="z-10 flex items-center justify-between bg-[#f4f5f8] px-8 py-5">
                <button
                    id="sidebar-toggle-button"
                    class="flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200 bg-white text-slate-600 transition hover:border-slate-300 hover:text-slate-900"
                    aria-label="Показать меню"
                >
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="flex items-center gap-3">
                    <button
                        id="global-add-button"
                        class="flex items-center gap-2 rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm shadow-indigo-600/20 transition hover:bg-indigo-700 active:bg-indigo-800"
                    >
                        <i class="fa-solid fa-plus text-xs"></i>
                        Добавить
                    </button>
                </div>
            </header>

            <div id="section-dashboard-content" class="flex-1 overflow-y-auto px-8 pb-8 pt-2 [&::-webkit-scrollbar]:thin [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-slate-300/70 hover:[&::-webkit-scrollbar-thumb]:bg-slate-400" style="scrollbar-width: thin; -ms-overflow-style: auto;">
                <div id="dashboard-layout" class="mx-auto flex max-w-[1400px] flex-col gap-6">
                    <section id="card-inbox" class="rounded-[24px] border border-slate-100/50 bg-white p-7 shadow-sm">
                        <div class="mb-6 flex items-start justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900">Inbox</h2>
                            </div>
                            <div class="flex items-center gap-2">
                                <span id="inbox-mode-badge" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-500"></span>
                                <button
                                    id="inbox-add-button"
                                    class="flex items-center gap-2 rounded-xl bg-indigo-50 px-4 py-2 text-sm font-medium text-indigo-600 transition-colors hover:bg-indigo-100"
                                >
                                    <i class="fa-solid fa-bolt text-xs"></i>
                                    Добавить
                                </button>
                            </div>
                        </div>

                        <div id="inbox-focus-hint" class="hidden mb-4 rounded-2xl border border-slate-100 bg-slate-50/80 px-4 py-3 text-sm text-slate-600"></div>
                        <div id="inbox-list" class="flex flex-col gap-3"></div>

                        <div id="inbox-empty-state" class="mt-6 hidden items-center gap-4 rounded-2xl border border-slate-100 bg-slate-50/80 p-5">
                            <div class="text-2xl">🎉</div>
                            <div>
                                <div class="text-sm font-medium text-slate-700">Inbox пуст</div>
                                <div class="mt-0.5 text-xs text-slate-500">Новые входящие идеи пока не мешают думать.</div>
                            </div>
                        </div>
                    </section>

                    <section id="card-tasks" class="hidden rounded-[24px] border border-slate-100/50 bg-white p-7 shadow-sm">
                        <div class="mb-5 flex items-start justify-between gap-4">
                            <div id="tasks-heading-group">
                                <h2 class="text-xl font-bold text-slate-900">Tasks</h2>
                                <p id="tasks-caption" class="hidden"></p>
                            </div>
                            <div id="tasks-toolbar" class="flex flex-wrap items-center justify-end gap-2"></div>
                        </div>

                        <div id="tasks-content" class="flex flex-col gap-3"></div>

                        <div id="tasks-empty-state" class="hidden rounded-2xl border border-dashed border-slate-200 bg-slate-50 p-4 text-sm text-slate-500">
                            Пусто
                        </div>
                    </section>

                    <section id="card-projects" class="hidden rounded-[24px] border border-slate-100/50 bg-white p-7 shadow-sm">
                        <div class="mb-5 flex items-start justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900">Projects</h2>
                                <p id="projects-caption" class="hidden"></p>
                            </div>
                            <div id="projects-toolbar" class="flex flex-wrap items-center justify-end gap-2"></div>
                        </div>

                        <div id="projects-content" class="flex flex-col gap-4"></div>

                        <div id="projects-empty-state" class="hidden rounded-2xl border border-dashed border-slate-200 bg-slate-50 p-4 text-sm text-slate-500">
                            Проектов пока нет.
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="/app.js"></script>
</body>
</html>
